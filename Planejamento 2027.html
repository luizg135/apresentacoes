const LOGO=document.querySelector('.brand').src;

function heading(s,sub=''){return `<div class="kicker">${esc(chapter(s.n))}</div><h1 class="title" id="slideTitle">${esc(s.title.toLocaleLowerCase('pt-BR').replace(/^./,c=>c.toUpperCase()))}</h1>${sub?`<p class="subtitle">${esc(sub)}</p>`:''}`}
function rankHeading(s){return `<div class="kicker">${esc(chapter(s.n))}</div><h1 class="title" id="slideTitle">${esc(s.title)}</h1><p class="subtitle">${esc(s.texts[0])}</p>`}

else if(s.n===3){html=heading(s,s.texts[0])+`<div class="body two-col"><div class="metric-block"><div class="large">164</div><p>cursos com atualização indicada</p><div class="minor">63,6% do catálogo</div></div><div class="bars">${s.table.slice(1).map((r,i)=>bar(r[0],r[1],r[2].replace('%',''),i>1?'muted':i===0?'dark':'')).join('')}</div></div>${note('“Outro” reúne sugestões de inativação e registros que precisam de confirmação.')}`}
else if(s.n===4){html=heading(s,s.texts[0])+`<div class="body criterion-layout"><div class="criteria">${s.table.slice(1,-1).map(r=>`<div class="criterion"><div class="criterion-head"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div><div class="bar-track"><div class="bar-fill" style="width:${num(r[1])/18*100}%"></div></div></div>`).join('')}</div><div class="simple-stat"><strong>100</strong><h2>pontos no total</h2><p>Quanto maior a pontuação, maior o enquadramento do curso nos critérios de avaliação.</p></div></div>`}
else if(s.n===5){html=heading(s,s.texts[0])+`<p class="subtitle body">${esc(s.texts[1])}</p><div class="body two-col"><div class="metric-block"><div class="large">175</div><p>cursos com recomendação de manter</p><div class="minor">67,8% do catálogo</div></div><div class="bars">${s.table.slice(1).map((r,i)=>bar(r[0],r[1],r[2].replace('%',''),i>1?'muted':i===0?'dark':'')).join('')}</div></div>${note(s.texts[2])}`}
else if(s.n===6){let rows=s.table.map(r=>[...r]);if(percent){rows[0]=['Responsável','Manter (%)','Atualizar (%)','Inativar (%)'];rows=rows.map((r,i)=>i===0?r:[r[0],...r.slice(1).map(v=>fmt(Number(v)/r.slice(1).reduce((a,v)=>a+Number(v),0)*100)+'%')]);}html=heading(s,'Recomendações registradas, distribuídas por responsável')+`<div class="rank-tools"><div class="switches"><button class="chip ${!percent?'active':''}" data-mode="count" aria-pressed="${!percent}">Quantidade</button><button class="chip ${percent?'active':''}" data-mode="percent" aria-pressed="${percent}">Percentual por responsável</button></div><span class="rank-hint">${percent?'Percentuais calculados sobre as decisões informadas':'255 decisões informadas'}</span></div>`+table(rows)+note(s.texts[0])}
else if(s.n===7){html=heading(s)+`<p class="intro">${esc(s.texts[0])}</p><div class="selection single"><div><div class="count-cards"><div class="count-card"><b>20</b><p>Revisão do<br>curso inteiro</p></div><div class="count-card"><b>21</b><p>Atualização<br>de recursos</p></div></div><p class="split-total"><strong>41 cursos</strong> no cenário 1</p></div></div>`}
else if(s.n===17){html=heading(s,s.texts[0])+`<p class="intro">${esc(s.texts[1])}</p><div class="integral"><strong>38</strong><span>selecionados entre 74 com revisão integral indicada</span></div><div style="margin-top:23px"><button class="primary" data-go="17">Ver revisões integrais por técnico</button></div>`}
else if(s.n===27){html=`<div class="thanks"><div class="kicker">Departamento de Educação</div><h1 id="slideTitle">Obrigado!</h1><p>Planejamento de atualização dos cursos de catálogo</p><strong>2027</strong><div class="thanks-actions"><button class="primary secondary" data-go="0">Voltar ao início</button><a class="primary" href="https://senarpr-my.sharepoint.com/:x:/g/personal/luiz_borato_sistemafaep_org_br/IQAeqVjeHLkySqgwjn-DjINrAUBzJdd8uyWOkD5sJj8S5Qg?e=fGhUKp" target="_blank" rel="noopener noreferrer">Abrir tabelas de dados gerais</a></div></div>`}
else html=rank(s);
$('screen').className='screen'+(s.n===6?' decision':s.n===21?' dense':s.n===1||s.n===27?' hero':'');$('screen').innerHTML=html;$('stage').scrollTop=0;$('progress').style.width=`${s.n/DATA.length*100}%`;$('prev').disabled=current===0;$('next').disabled=current===DATA.length-1;document.title=`${s.n}. ${s.title} 2027`;history.replaceState(null,'',`#${s.n}`);
}
function go(i){if(i<0||i>=DATA.length)return;current=i;scopeFilter='all';percent=false;render();closeIndex()}
function index(){const query=norm($('indexSearch').value);const matches=DATA.filter(s=>norm(s.title+' '+s.texts.join(' ')+' '+(s.table||[]).flat().join(' ')).includes(query));$('indexList').innerHTML=matches.map(s=>`<button class="index-item ${s.n===current+1?'active':''}" data-go="${s.n-1}"><span class="number">${String(s.n).padStart(2,'0')}</span><span>${esc(s.title)}<small>${esc(chapter(s.n))}</small></span></button>`).join('')||'<p class="empty">Nenhuma tela encontrada.</p>'}
function openIndex(){lastFocus=document.activeElement;$('drawer').classList.add('open');index();$('indexSearch').focus()}
function closeIndex(){if(!$('drawer').classList.contains('open'))return;$('drawer').classList.remove('open');if(lastFocus)lastFocus.focus()}
function course(i){const s=DATA[current],r=s.table[i+1],sc=s.n<17?1:2,other=DATA[s.n+(sc===1?10:-10)-1];const same=other.table.slice(1).find(x=>courseKey(x[0])===courseKey(r[0]));$('details').innerHTML=`<div class="dialog-label">${esc(s.title)} · cenário ${sc}</div><div class="dialog-top"><h2>${esc(plain(r[0]))}</h2><button class="close" data-close="details" aria-label="Fechar detalhes">×</button></div><div class="detail-stats"><div><span>Pontuação informada</span><b>${fmt(num(r[1]))} / 100</b></div><div><span>Escopo indicado</span><b style="font-size:25px">${esc(r[2])}</b></div></div><p class="detail-p">${same?`Este curso também aparece no cenário ${sc===1?2:1}, com ${fmt(num(same[1]))} pontos.`:`Este curso não aparece na seleção do cenário ${sc===1?2:1} para este técnico.`}</p>${s.texts[1]?`<div class="note"><strong>Observação do slide deste técnico</strong><br>${esc(s.texts[1])}</div>`:''}<div style="margin-top:25px"><button class="primary" data-go="${other.n-1}" data-dismiss-details>Ver o outro cenário do técnico</button></div>`;$('details').showModal()}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullBtn').title='Use F11 para tela cheia do navegador'}}
document.addEventListener('fullscreenchange',()=>{$('fullBtn').setAttribute('aria-label',document.fullscreenElement?'Sair da tela cheia':'Entrar em tela cheia')});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.close)$(t.dataset.close).close();if(t.dataset.go!==undefined){if(t.hasAttribute('data-dismiss-details'))$('details').close();go(Number(t.dataset.go))}if(t.dataset.filter){scopeFilter=t.dataset.filter;render()}if(t.dataset.mode){percent=t.dataset.mode==='percent';render()}if(t.dataset.course!==undefined)course(Number(t.dataset.course))});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('closeIndex').onclick=closeIndex;$('drawer').onclick=e=>{if(e.target===$('drawer'))closeIndex()};$('indexSearch').oninput=index;$('fullBtn').onclick=fullscreen;
document.addEventListener('keydown',e=>{if($('drawer').classList.contains('open')){if(e.key==='Escape')closeIndex();if(e.key==='Tab'){const items=$('drawer').querySelectorAll('button,input');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown'].includes(e.key)||e.key===' '&&!['BUTTON','A'].includes(e.target.tagName)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(DATA.length-1)}else if(e.key.toLowerCase()==='i'){e.preventDefault();openIndex()}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}});
let touch=null;$('stage').addEventListener('touchstart',e=>{if(!e.target.closest('button,input,select'))touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});$('stage').addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>85&&Math.abs(dy)<55)go(current+(dx<0?1:-1));touch=null},{passive:true});
function buildPrint(){$('printDeck').innerHTML=DATA.map(s=>`<section class="print-page"><div class="print-header"><span>Planejamento 2027</span><img src="${LOGO}" alt="Sistema FAEP"></div><h1>${esc(s.title)}</h1>${s.texts.map(t=>`<p>${esc(t).replace(/\n/g,'<br>')}</p>`).join('')}${s.table?table(s.table):''}<small>${s.n} / ${DATA.length} · Conteúdo: Atualizações 2027.pptx</small></section>`).join('')}
window.addEventListener('beforeprint',buildPrint);window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(n>=1&&n<=DATA.length)go(n-1)});render();
</script>
</body></html>
